# Murmur for iPhone and iPad (docs/MOBIL.md). `xcodegen` makes Murmur.xcodeproj from this file:
#   ./fetch-models.sh && ./bindings.sh && xcodegen && open Murmur.xcodeproj
name: Murmur
options:
  bundleIdPrefix: com.quicodomingo
  developmentLanguage: ca
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - Sources
      - Generated/murmur_mobile.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      - path: Resources/models
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Rust (murmur-mobile)
        script: ./build-rust.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicodomingo.murmur.ios
        PRODUCT_NAME: Murmur
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Murmur-Bridging-Header.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../ffi/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../ffi/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: ["-lmurmur_mobile", "-lc++"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
