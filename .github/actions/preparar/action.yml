# El que necessiten totes les compilacions: Node, Rust, la memòria cau i, a Linux, les
# biblioteques de WebKitGTK, ALSA i D-Bus.
name: Prepara l'entorn
description: Node, Rust i les dependències del sistema per compilar Murmur
runs:
  using: composite
  steps:
    - name: Dependències de Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          patchelf libasound2-dev libdbus-1-dev libssl-dev libgomp1 cmake clang
    # Windows ARM: ggml només pot triar una CPU ARM concreta compilant amb clang (amb MSVC demana
    # GGML_NATIVE, que agafaria l'SVE de l'executor, que cap Snapdragon té). ARMv8.2 amb dotprod i
    # fp16, que tenen tots els PC amb Windows ARM (Snapdragon 8cx i X). Amb Ninja i clang-cl, i
    # l'entorn ARM64 de Visual Studio: amb el generador de Visual Studio, el crate cmake hi força
    # les eines x64 (-Thost=x64), que aquest executor no té. scripts/build-whisper.mjs fa el
    # mateix per a whisper.cpp.
    - name: Windows ARM (clang i Ninja per a llama.cpp i whisper.cpp)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) { choco install llvm -y --no-progress }
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $before = @{}; Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
            "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
        }
        "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        @(
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin",
          "CMAKE_GENERATOR=Ninja",
          "CMAKE_C_COMPILER=clang-cl",
          "CMAKE_CXX_COMPILER=clang-cl",
          "GGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: Dependències de Node
      shell: bash
      working-directory: app
      run: npm ci
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: |
          app/src-tauri
          app/whisper
    # La memòria cau de Rust pot tornar el build de sherpa-onnx-sys sense les biblioteques que
    # baixa (Cargo el dona per fet i l'enllaç falla): es refà cada cop, només és una descàrrega.
    - name: Refés sherpa-onnx-sys
      shell: bash
      working-directory: app/src-tauri
      run: |
        cargo clean -p sherpa-onnx-sys
        cargo clean -p sherpa-onnx-sys --release
        rm -rf target/sherpa-onnx-prebuilt
