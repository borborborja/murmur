# Murmur for iPhone and iPad (docs/MOBIL.md). `xcodegen` makes Murmur.xcodeproj from this file:
#   ./fetch-models.sh && ./bindings.sh && xcodegen && open Murmur.xcodeproj
name: Murmur
options:
  bundleIdPrefix: com.quicodomingo
  developmentLanguage: ca
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # The team that signs it (Xcode › Signing & Capabilities): kept here so regenerating the
    # project doesn't drop it.
    DEVELOPMENT_TEAM: NYQHV4FSKC
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Generated/murmur_mobile.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/models
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
      - target: MurmurWidgets
        embed: true
    preBuildScripts:
      - name: Rust (murmur-mobile)
        script: ./build-rust.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicodomingo.murmur.ios
        PRODUCT_NAME: Murmur
        INFOPLIST_FILE: Sources/Info.plist
        # Resources/icon.svg, rendered by make-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Murmur-Bridging-Header.h
        # The static library by its path: the crate also makes a .dylib (for Android), which -l
        # would prefer, and which the phone can't load.
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(PROJECT_DIR)/../../ffi/target/aarch64-apple-ios/release/libmurmur_mobile.a", "-lc++"]
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ["$(PROJECT_DIR)/../../ffi/target/aarch64-apple-ios-sim/release/libmurmur_mobile.a", "-lc++"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  # The recording on the lock screen and in the Dynamic Island (a Live Activity).
  MurmurWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - Sources/Theme.swift
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicodomingo.murmur.ios.widgets
        PRODUCT_NAME: MurmurWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
