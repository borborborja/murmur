# The afternoon test (docs/MOBIL.md): `xcodegen` makes MurmurProbe.xcodeproj from this file.
#   ./fetch-models.sh && xcodegen && open MurmurProbe.xcodeproj
name: MurmurProbe
options:
  bundleIdPrefix: com.quicodomingo.murmur
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Pick your team in Xcode (Signing & Capabilities) to run it on the iPhone.
    CODE_SIGN_STYLE: Automatic
targets:
  MurmurProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/models
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ffi/target/sherpa-onnx-prebuilt/sherpa-onnx-v1.13.8-ios-shared-onnxruntime-static/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Rust (murmur-probe)
        script: ./build-rust.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicodomingo.murmur.probe
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MurmurProbe-Bridging-Header.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/ffi/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/ffi/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: ["-lmurmur_probe", "-lc++"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
