[package]
name = "murmur-mobile"
version = "0.1.0"
description = "Murmur's engine for the phone apps (iOS, later Android), through UniFFI"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: on phones sherpa-onnx comes as a shared library (an xcframework on iOS), and
# that feature must not reach the computer's build, which links it statically.
[workspace]

[lib]
name = "murmur_mobile"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
murmur-core = { path = "../../core", default-features = false }
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
uniffi = { version = "0.32", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
hound = "3.5"
opus = "0.4"

[features]
punctuation = ["murmur-core/punctuation"]

[profile.release]
opt-level = 3
lto = "thin"

# sherpa-onnx-sys still depends on the yanked zip 2.x series.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.6.1" }
